name: Build, Cache & Push BE Image

on:
  push:
    tags:
      - 'be-*'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache cargo registry & git
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: deps-{{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build output
        uses: actions/cache@v3
        with:
          path: target
          key: build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build project binary
        run: cargo build --release --locked

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push BE image
        uses: docker/build-push-action@v5
        with:
          context: back
          file: back/Dockerfile
          push: true
          registry: docker.io
          tags: kirillsalykin/project:${{ github.ref_name }}
