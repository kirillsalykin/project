{
  listen 80;
  server_name localhost;

  location / {
    root   /usr/share/nginx/html/site;
    index  index.html;
    try_files $uri $uri.html $uri/ /index.html;
  }

  location /app {
    alias   /usr/share/nginx/html/app;
    index   index.html;
    try_files $uri $uri.html $uri/ /app/index.html;
  }
}
