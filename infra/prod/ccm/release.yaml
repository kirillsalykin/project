---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: ccm
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: 1.24.0
      sourceRef:
        kind: HelmRepository
        name: ccm
        namespace: flux-system
  values:
    secret:
      existingSecretName: hcloud-token
    config:
      privateNetworks:
        enabled: true
        id: net
        subnet: 10.10.0.0/16
        disableAttachedCheck: false
