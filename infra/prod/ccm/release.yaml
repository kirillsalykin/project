---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: ccm
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: 1.24.0
      sourceRef:
        kind: HelmRepository
        name: ccm
        namespace: flux-system
  values:
    hcloud:
      token:
        secretKeyRef:
          name: "hcloud-token"
          key: token
    clusterName: prod
