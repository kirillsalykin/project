---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: ccm
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: 1.24.0
      sourceRef:
        kind: HelmRepository
        name: ccm
        namespace: flux-system
  values:
    env:
      HCLOUD_TOKEN:
        valueFrom:
          secretKeyRef:
            name: hcloud
            key: token

    monitoring:
      enabled: false

    networking:
      enabled: true
      network:
        clusterCIDR: 10.42.0.0/16
        valueFrom:
          secretKeyRef:
            name: hcloud
            key: network
