---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
  annotations:
    load-balancer.hetzner.cloud/location: ash
    load-balancer.hetzner.cloud/use-private-ip: "true"
    load-balancer.hetzner.cloud/protocol: https
    load-balancer.hetzner.cloud/certificate-type: managed
    load-balancer.hetzner.cloud/http-managed-certificate-domains: prostor.email
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: websecure
      port: 443
      targetPort: 80

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-first-segment
  namespace: default
spec:
  stripPrefixRegex:
    regex:
      - "^/[^/]+"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/app`)
      kind: Rule
      middlewares:
        - name: strip-first-segment
      services:
        - name: app
          port: 80

    - match: PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: strip-first-segment
      services:
        - name: api
          port: 80

    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: site
          port: 80
