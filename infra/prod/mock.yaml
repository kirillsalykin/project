# -------------------
# ConfigMap for "site"
# -------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-html
data:
  index.html: |
    <!DOCTYPE html>
    <html><body><h1>site</h1></body></html>
---
# ----------------------------------------
# Deployment + Service for "site" backend
# ----------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: site-html
---
apiVersion: v1
kind: Service
metadata:
  name: site-service
spec:
  type: ClusterIP
  selector:
    app: site
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

