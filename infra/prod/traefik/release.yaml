---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 5m

  targetNamespace: traefik

  chart:
    spec:
      chart: traefik
      version: "35.1.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system

  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace

  values:
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: true
        ingressClass: traefik
      kubernetesGateway:
        enabled: false

    service:
      enabled: false

    ports:
      web:
        expose:
          default: true
      websecure:
        expose:
          default: false
