---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: "35.1.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    providers:
      kubernetesIngress:
        ingressClass: traefik
        publishedService:
          enabled: true
    service:
      type: LoadBalancer
      annotations:
        load-balancer.hetzner.cloud/location: ash
        load-balancer.hetzner.cloud/use-private-ip: "true"
    ports:
      web:
        expose:
          default: true
      websecure:
        expose:
          default: true
    additionalArguments:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
